<!DOCTYPE html>
<html lang="ja">
<head>
<script>
  // LINEなどのアプリ内ブラウザで開かれたら、標準のブラウザ（Safari / Chrome等）へ
  // 開き直す。canvasを使うゲームはアプリ内ブラウザだと不安定なことがあるため。
  (function () {
    var ua = navigator.userAgent || '';
    var url = location.href;
    if (/\bLine\//i.test(ua) && url.indexOf('openExternalBrowser=') === -1) {
      // LINEはこのパラメータを見て、自身を閉じて標準ブラウザで同じURLを開く
      var sep = url.indexOf('?') === -1 ? '?' : '&';
      location.replace(url + sep + 'openExternalBrowser=1');
    }
  })();
</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0b1712" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>PAIR KICK</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="apple-mobile-web-app-title" content="PAIR KICK" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <!-- UI はここに集中。半透明レイヤー + blur。フィールドはフラットに保つ。 -->
    <div id="stage" aria-hidden="false">

      <div id="hud-slot"><div id="hud" class="glass">
        <span class="dot dot-a"></span>
        <span id="score-a" class="num">0</span>
        <span class="sep"></span>
        <span id="score-b" class="num">0</span>
        <span class="dot dot-b"></span>
      </div></div>

      <div id="cpu-tag" hidden></div>
      <button id="spec-exit" class="glass corner-btn" hidden>観戦をやめる</button>
      <button id="menu-btn" class="glass corner-btn" hidden aria-label="メニューを開く">メニュー</button>

      <div id="menu" hidden>
        <div id="menu-card" class="glass" role="dialog" aria-modal="true" aria-labelledby="menu-title">
          <div id="menu-title">一時停止中</div>
          <button id="menu-resume" class="pill">試合に戻る</button>
          <button id="menu-home" class="pill pill-ghost">ホームへ</button>
        </div>
      </div>

      <div id="banner"><div id="banner-in" class="glass banner-card">
        <div id="banner-title">READY</div>
        <div id="banner-sub"></div>
      </div></div>

      <div id="overlay">
        <div id="overlay-card" class="glass">
          <div id="ov-kicker">2対2 / 2対3サッカー</div>
          <h1 id="ov-title">PAIR&nbsp;KICK</h1>
          <p id="ov-body">2つの駒、2本の親指。<br>左半分で左の駒、右半分で右の駒。</p>
          <div id="ov-opponents" role="group" aria-label="対戦相手">
            <button class="seg" data-opp="bot">ボット</button>
            <button class="seg" data-opp="human">対人戦</button>
            <button class="seg" data-opp="watch">観戦</button>
          </div>
          <div id="ov-cpu">
            <label for="cpu-level">CPUレベル（1〜100）</label>
            <input id="cpu-level" type="number" min="1" max="100" step="1" value="3" inputmode="numeric" aria-describedby="cpu-help" />
            <p id="cpu-summary" aria-live="polite">自分2人 対 CPU2人</p>
            <p id="cpu-help">Lv.80から相手は3人。<br>Lv.100は先読みと連携の神級。<br>速さ・大きさ・威力は共通。</p>
          </div>
          <div id="ov-profile" hidden>
            <label for="player-name">名前</label>
            <input id="player-name" type="text" maxlength="12" placeholder="ゲスト" autocomplete="nickname" enterkeyhint="done" />
            <p id="profile-stats">レート 1500 · 0勝 0敗</p>
          </div>
          <div id="ov-watch" hidden>
            <p id="watch-msg">試合を探しています…</p>
            <div id="watch-list" role="list"></div>
          </div>
          <div id="ov-settings">
          <div id="ov-flick" class="slider">
            <label for="flick-level"><span>フリックの感度</span> <span id="flick-level-val">5</span></label>
            <input id="flick-level" type="range" min="1" max="9" step="1" value="5" />
            <div class="slider-ends"><span>はっきり払う</span><span>わずかでも出る</span></div>
          </div>
          <div id="ov-stick" class="slider">
            <label for="stick-size"><span><span class="long">スティックの</span>大きさ</span> <span id="stick-size-val">100%</span></label>
            <input id="stick-size" type="range" min="25" max="100" step="5" value="100" />
            <div id="stick-preview" aria-hidden="true"><b></b></div>
          </div>
          </div>
          <div id="ov-hints">
            <div class="hint"><b>倒す</b><span>移動</span></div>
            <div class="hint" id="hint-act"><b>離す</b><span>キック / ダッシュ</span></div>
          </div>
          <button id="ov-btn" class="pill">はじめる</button>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
