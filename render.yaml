# Render Blueprint。
# 対人戦に WebSocket サーバーが要るので Web Service で動かす。
# server.js は静的配信も兼ねているので、これ1つでゲーム本体も配信される。
services:
  - type: web
    name: pair-kick
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /health
    pullRequestPreviewsEnabled: false

# 対人戦が要らないなら、静的サイトとしても配信できる（その場合 /ws は無い）:
#   - type: web
#     name: pair-kick
#     runtime: static
#     buildCommand: ""
#     staticPublishPath: .
